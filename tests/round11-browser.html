<!doctype html><meta charset="utf-8"><title>Round 11 acceptance</title><style>body{font:14px system-ui;background:#eee;color:#111}iframe{width:1280px;height:800px;display:block}pre{white-space:pre-wrap}</style>
<h1>Round 11 — private six-book acceptance</h1><label>Six original EPUBs <input id="epubs" type="file" multiple accept=".epub"></label><button id="run">Run acceptance</button><pre id="results">Ready. Uses additive imports; existing records are preserved.</pre><iframe id="app" src="../dist/index.html"></iframe>
<script src="../dist/vendor/jszip.min.js"></script><script src="../dist/world-model.js"></script><script src="../dist/tree-model.js"></script><script src="../dist/model.js"></script><script src="../dist/storage.js?v=round11-1"></script><script>
const out=document.querySelector('#results'),frame=document.querySelector('#app');let count=0;
const log=s=>out.textContent+='\n'+s,check=(v,s)=>{if(!v)throw Error(s);count++;log('PASS '+s)},wait=async fn=>{for(let i=0;i<400;i++){if(await fn())return;await new Promise(r=>setTimeout(r,40))}throw Error('Timed out: '+fn.toString())};
function probe(){const w=frame.contentWindow,s=w.document.createElement('script');s.textContent='window.testAPI={S:SampleLibrary,R:Reader,B:Board,W:World,T:TreeModel,read:()=>ArchiveDB.read(db),decode:decodeBackup,open:openBook,tab:setWorkspaceTab,setting,getSetting,font:importSharedFont,update:updateBook};';w.document.body.append(s);return w.testAPI}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;out.textContent='Running…';try{
 if(!['8001','8002'].includes(location.port))throw Error('Use the isolated test server on port 8001 or 8002.');
 await wait(()=>frame.contentDocument?.querySelector('#newLibrary'));let api=probe(),before=await api.read(),files=[...document.querySelector('#epubs').files];check(files.length===6,'six original EPUBs supplied');
 let drafted;const build=api.S.build.bind(api.S);api.S.build=async(...args)=>drafted=await build(...args);
 const result=await api.S.importEPUBs(files);check(drafted.books[4].board.cards.filter(c=>c.title.startsWith('Reading prompt —')).length===2,'unresolved highlight plans become informative notes');check(result.libraryId==='sample-v2-library','stable curated Library identity');let after=await api.read();
 const normalized=async v=>{if(['[object Blob]','[object File]'].includes(Object.prototype.toString.call(v)))return {type:v.type,bytes:await crypto.subtle.digest('SHA-256',await v.arrayBuffer()).then(a=>Array.from(new Uint8Array(a)).join(','))};if(Array.isArray(v))return Promise.all(v.map(normalized));if(v&&typeof v==='object'){const o={};for(const[k,x]of Object.entries(v))o[k]=await normalized(x);return o}return v};
 for(const store of ['libraries','books','fonts'])for(const old of before[store]){if(JSON.stringify(await normalized(old))!==JSON.stringify(await normalized(after[store].find(r=>r.id===old.id))))throw Error('Changed existing '+store+' '+old.id);count++}log('PASS all '+before.books.length+' existing books, '+before.libraries.length+' Libraries and '+before.fonts.length+' fonts preserved byte-for-byte');
 const sample=after.books.filter(b=>b.libraryId===result.libraryId).sort((a,b)=>a.order-b.order);check(sample.length===6,'exactly six sample books');check(sample.map(b=>b.id).join(',')==='sample-v2-alice,sample-v2-pride,sample-v2-dracula,sample-v2-tru-tien,sample-v2-thien-quan,sample-v2-guilt','specified order');
 check(WorldModel.network(sample[0].world).edges.length===6,'Alice Network connections');check(TreeModel.layout(sample[1],sample[1].world.trees[0].id).nodes.length===7,'explicit Bennet family');check(sample[3].world.trees.map(t=>t.memberIds.length).join(',')==='5,4','explicit hierarchy memberships');check(TreeModel.layout(sample[3],sample[3].world.trees[1].id).headings.length===3,'hierarchy rank rows');
 for(const b of sample){api.open(b.id);await wait(()=>api.R.bookId===b.id&&api.R.ready);const chapter=api.R.chapters.findIndex(c=>c.href===b.sampleReferenceReport[0].reference.split('#')[0]);check(chapter>=0,b.title+' intended chapter is in the reading spine');await api.R.show(chapter);await wait(()=>api.R.ready);check(api.R.frame.contentDocument.body.textContent.trim().length>0,b.title+' opens in actual Reader');for(const h of b.highlights||[]){await api.R.jump(h);await wait(()=>api.R.ready&&api.R.chapters[api.R.index].href===h.href);check(api.R.text.slice(h.start,h.end)===h.text,b.title+' genuine source anchor')}
  log('REFERENCES '+b.title+': '+JSON.stringify(b.sampleReferenceReport));
 }
 api.open(sample[0].id);api.tab('map');await wait(()=>frame.contentDocument.querySelector('#worldNodes')?.children.length===7);check(frame.contentDocument.querySelectorAll('#worldLines [data-relation]').length===6||frame.contentDocument.querySelectorAll('#worldLines [role=button]').length===6,'Alice Network draws six connections');
 api.open(sample[1].id);api.tab('map');await api.W.switchMap('trees',sample[1].world.trees[0].id);check(frame.contentDocument.querySelector('#worldNodes').children.length===7&&frame.contentDocument.querySelector('#worldHeadings').textContent.includes('Generation 2'),'Family Tree renders two generations');
 api.open(sample[3].id);api.tab('map');await api.W.switchMap('trees',sample[3].world.trees[1].id);check(frame.contentDocument.querySelector('#worldNodes').children.length===4&&frame.contentDocument.querySelector('#worldHeadings').textContent.includes('Đại sư huynh'),'Hierarchy renders four explicit members and rank headings');
 const dracula=sample[2];api.open(dracula.id);api.tab('split');await wait(()=>frame.contentDocument.querySelector('#workspacePanels').dataset.mode==='split'||frame.contentDocument.body.classList.contains('split-view')||!frame.contentDocument.querySelector('#boardPanel').hidden);check(!frame.contentDocument.querySelector('#readerPanel').hidden&&!frame.contentDocument.querySelector('#boardPanel').hidden,'Dracula Reader + Board Split');
 const snapshot=await api.read();const again=await api.S.importEPUBs(files);check(!again.installed,'repeated install is a no-op');check((await api.read()).books.length===snapshot.books.length,'no duplicates');
 // A private image fixture verifies portable immutable board image assets.
 const canvas=document.createElement('canvas');canvas.width=20;canvas.height=20;canvas.getContext('2d').fillRect(0,0,20,20);const image=await new Promise(r=>canvas.toBlob(r,'image/png'));
 await api.update(sample[4].id,b=>({...b,board:{...b.board,assets:{...b.board.assets,'round11-test-image':{id:'round11-test-image',file:image,width:1,height:1,name:'test.png'}},cards:[...b.board.cards.filter(c=>c.id!=='round11-image'),{id:'round11-image',type:'image',title:'Test image',body:'Private acceptance image',imageAssetId:'round11-test-image',imageFit:'contain',x:1200,y:30,w:240,h:200}]}}));
 check(sample[4].highlights.length===1,'one genuine verified TQTP highlight and Quote Card');
 const font=await api.font(new File([await(await fetch('fixtures/ABeeZee-Regular.ttf')).arrayBuffer()],'sample-font.ttf'));await api.update(sample[0].id,b=>({...b,userCover:image,coverSource:'custom',design:{...b.design,artwork:image,mode:'both',title:{font:'font-'+font.id}}}));
 const packageBlob=await api.S.package(result.libraryId),decoded=await api.decode(new File([packageBlob],'sample.zip'),true);check(decoded.kind==='library-seed','versioned portable seed');check(decoded.data.fonts.some(f=>f.id===font.id),'referenced custom font included');check(decoded.data.books.find(b=>b.id===sample[0].id).design.artwork.size===image.size,'custom cover and spine image included');check(decoded.data.settings.length===0&&decoded.data.libraries.length===1,'no global preferences or unrelated Libraries exported');
 const fresh=await ArchiveDB.open('round11-clean-'+Date.now()),clean=await ArchiveDB.installSeed(fresh,decoded.data,decoded.seed.id);check(clean.installed,'seed installs into clean IndexedDB');const restored=await ArchiveDB.read(fresh);check(restored.books.length===6,'clean restoration includes six EPUBs');
 for(const b of decoded.data.books){const rb=restored.books.find(x=>x.id===b.id);check(JSON.stringify(await normalized(rb))===JSON.stringify(await normalized(b)),b.title+' complete payload/EPUB bytes restored')}
 check(! (await ArchiveDB.installSeed(fresh,decoded.data,decoded.seed.id)).installed,'clean repeat import idempotent');
 const edited={...restored,books:restored.books.slice(1).map((b,i)=>i?b:{...b,title:'My edited sample title'})};await ArchiveDB.patch(fresh,edited,restored);check(!(await ArchiveDB.installSeed(fresh,decoded.data,decoded.seed.id)).installed,'install marker survives sample edits/deletions');const kept=await ArchiveDB.read(fresh);check(kept.books.length===5&&kept.books.some(b=>b.title==='My edited sample title'),'repeat installation does not recreate deleted books or overwrite titles');fresh.close();
 const race=await ArchiveDB.open('round11-race-'+Date.now()),raceResults=await Promise.all([ArchiveDB.installSeed(race,decoded.data,decoded.seed.id),ArchiveDB.installSeed(race,decoded.data,decoded.seed.id)]);check(raceResults.filter(r=>r.installed).length===1&&(await ArchiveDB.read(race)).books.length===6,'concurrent installations commit exactly once');race.close();
 const conflict=await ArchiveDB.open('round11-conflict-'+Date.now()),sentinel={books:[{...decoded.data.books[0],libraryId:'existing-library',title:'Existing protected book'}],libraries:[{id:'existing-library',name:'Sample Library',background:'#0a0a0a',line:'#777777',order:0}],fonts:[],settings:[{id:'protected-preference',value:'keep'}]};await ArchiveDB.write(conflict,sentinel);let rejected=false;try{await ArchiveDB.installSeed(conflict,decoded.data,decoded.seed.id)}catch{rejected=true}check(rejected,'conflicting IDs rejected');check(JSON.stringify(await normalized(await ArchiveDB.read(conflict)))===JSON.stringify(await normalized(sentinel)),'collision rolls back all writes including installation marker');conflict.close();
 // Reload the actual application; inspect source-linked quotes and image elements.
 frame.src='../dist/index.html#book/sample-v2-thien-quan/board';await wait(()=>frame.contentDocument?.querySelector('#boardCanvas'));api=probe();await wait(()=>api.B.bookId==='sample-v2-thien-quan');const persisted=await api.read(),tq=persisted.books.find(b=>b.id==='sample-v2-thien-quan');check(tq.board.cards.some(c=>c.id==='round11-image')&&tq.board.assets['round11-test-image'].file.size===image.size,'image asset survives refresh');check(persisted.books.filter(b=>b.libraryId===result.libraryId).length===6,'refresh does not recreate samples');
 log('DONE '+count+' checks. Private seed '+packageBlob.size+' bytes.');
 }catch(e){log('FAIL '+e.stack)}finally{document.querySelector('#run').disabled=false}};
</script>
